name: Build SoftRebootInterceptor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;37.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Extract Android project
        run: |
          unzip -q SoftRebootInterceptor-cloud-build.zip
          test -f libxposed-example/gradlew
          test -d libxposed-example/app
          chmod +x libxposed-example/gradlew

      - name: Build debug APK
        working-directory: libxposed-example
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftRebootInterceptor-debug
          path: libxposed-example/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build SoftRebootInterceptor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER='\${{ steps.sdk.outputs.sdkmanager }}'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract and adapt Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q SoftRebootInterceptor-cloud-build.zip
          cd libxposed-example
          test -f gradlew
          test -d app
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = 37", "compileSdk = 36")
          s = s.replace('buildToolsVersion = "37.0.0"', 'buildToolsVersion = "36.0.0"')
          s = s.replace("targetSdk = 37", "targetSdk = 36")
          p.write_text(s)
          p = Path("gradle/libs.versions.toml")
          s = p.read_text().replace('xposed-api = "102.0.0"', 'xposed-api = "101.0.0"').replace('xposed-service = "102.0.0"', 'xposed-service = "101.0.0"')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: libxposed-example
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="libxposed-example/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftRebootInterceptor-debug
          path: libxposed-example/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
